# Render Blueprint for this app. Lets Render provision the web service
# from this file instead of manually clicking through the dashboard
# (New -> Blueprint -> pick this repo). You can also skip this file
# entirely and create the service by hand in the dashboard — see the
# deploy steps for both paths.
#
# ⚠️ IMPORTANT (found 2026-09-26, session 21): if this service was ever
# created by hand in the dashboard (not via "New -> Blueprint"), Render
# does NOT auto-sync changes to this file into that service's actual
# build settings — the dashboard's own "Build Command" field (Settings ->
# Build & Deploy) wins, and can silently drift out of sync with what's
# written here. This is exactly how the `npx prisma db push` step added
# below (session 19) failed to ever run in production: the build logs
# showed no db-push step at all, only the dashboard's stale command. If
# you change buildCommand here, also go check/update the dashboard field
# directly, or re-sync via Blueprint, or this file is just documentation.
#
# Native Node runtime, not Docker: unlike the original PHP app (whose
# Dockerfile/docker-entrypoint.sh exist to run migration scripts and a
# custom PHP built-in server), this Next.js app only needs `npm install`
# + `npm run build` + `npm start`, which Render's native Node runtime
# handles directly — no Dockerfile needed for this rewrite.
services:
  - type: web
    name: arp-next
    runtime: node
    plan: free
    region: oregon # change to whatever region your Postgres instance is in
    branch: main # confirm with: git branch --show-current
    # NODE_ENV=production (set below, needed at runtime) makes plain
    # `npm install` skip devDependencies during the build too - which
    # strips typescript, @types/*, tailwindcss, postcss, autoprefixer.
    # Without typescript present, Next can't read tsconfig's path
    # aliases (@/*) when building the webpack config, even though the
    # aliases are configured correctly. --include=dev forces them in
    # for the build; they aren't needed at runtime (npm start).
    # `prisma db push` added to the build 2026-09-26 (session 19, WhatsApp
    # auto-send): applies any additive schema changes (new tables/columns)
    # to the DB on every deploy, since Render's build never touched the DB
    # before this and the free plan has no Shell access to run it by hand.
    # Safe to leave here — it's a no-op when the schema already matches.
    # Would prompt/fail on a genuinely destructive change (dropped column,
    # changed type) instead of applying it, which is the correct behavior:
    # never add --accept-data-loss here without a human reading the diff.
    buildCommand: npm install --include=dev && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # --- Secrets: set these in the Render dashboard, not here ---
      # (sync: false means "Render will prompt for this value, never
      # store or generate it in this file")
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: CREDENTIAL_KEY
        sync: false # MUST equal the original PHP app's CREDENTIAL_KEY, see .env.example
      - key: CRON_SECRET
        sync: false
      # --- Not a secret: Render sets this automatically, listed here
      # only so instrumentation.ts's reference to it is self-documenting.
      # Do not set this by hand.
      # - RENDER_EXTERNAL_URL (auto)
      - key: NODE_ENV
        value: production
